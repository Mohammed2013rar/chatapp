<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#075E54">
<title>ChatApp</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: #efeae2; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  .hidden { display: none !important; }
  button { font-family: inherit; cursor: pointer; border: none; }
  input { font-family: inherit; font-size: 16px; }

  /* شاشة الدخول */
  #auth { padding: 24px; max-width: 400px; margin: auto; width: 100%; }
  #auth h1 { text-align: center; color: #075E54; }
  .tabs { display: flex; margin-bottom: 16px; background: #fff; border-radius: 8px; overflow: hidden; }
  .tab { flex: 1; padding: 12px; background: #fff; border: none; font-size: 15px; }
  .tab.active { background: #075E54; color: #fff; }
  .field { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; margin-bottom: 12px; }
  .btn { width: 100%; padding: 14px; background: #25D366; color: #fff; border-radius: 8px; font-size: 16px; font-weight: bold; }
  .btn:disabled { opacity: .5; }
  .err { color: #c00; text-align: center; margin-top: 12px; font-size: 14px; }

  /* شاشة الكود */
  #codeView { padding: 24px; max-width: 400px; margin: auto; text-align: center; }
  #codeView .code { font-size: 32px; font-weight: bold; letter-spacing: 4px; background: #fff; padding: 20px; border-radius: 12px; margin: 16px 0; user-select: all; }

  /* شاشة المحادثات */
  #chats { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .header { background: #075E54; color: #fff; padding: 12px 16px; display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  .header h2 { margin: 0; font-size: 18px; flex: 1; }
  .header button { background: none; color: #fff; font-size: 24px; padding: 4px 8px; }
  #chatList { flex: 1; overflow-y: auto; }
  .chat-item { padding: 14px 16px; background: #fff; border-bottom: 1px solid #eee; cursor: pointer; }
  .chat-item:hover { background: #f5f5f5; }
  .chat-item .name { font-weight: bold; margin-bottom: 4px; }
  .chat-item .last { color: #888; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .empty { text-align: center; padding: 40px; color: #999; }

  /* شاشة المحادثة */
  #conversation { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  #messages { flex: 1; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 4px; }
  .msg { max-width: 75%; padding: 8px 12px; border-radius: 12px; word-wrap: break-word; font-size: 15px; }
  .msg.me { background: #dcf8c6; align-self: flex-start; }
  .msg.them { background: #fff; align-self: flex-end; }
  #composer { display: flex; padding: 8px; background: #f0f0f0; gap: 8px; flex-shrink: 0; }
  #composer input { flex: 1; padding: 10px; border: none; border-radius: 20px; }
  #composer button { background: #25D366; color: #fff; padding: 0 20px; border-radius: 20px; font-size: 18px; }

  /* شاشة مجموعة جديدة */
  #newgroup { flex: 1; padding: 16px; overflow-y: auto; }
  .user-item { padding: 12px; background: #fff; border-radius: 8px; margin-bottom: 8px; display: flex; align-items: center; gap: 12px; cursor: pointer; }
  .user-item.selected { background: #dcf8c6; }
</style>
</head>
<body>

<!-- شاشة الدخول -->
<div id="auth">
  <h1>ChatApp</h1>
  <div class="tabs">
    <button class="tab active" onclick="setTab('login')">دخول</button>
    <button class="tab" onclick="setTab('register')">تسجيل</button>
  </div>
  <input class="field" id="username" placeholder="اسم المستخدم" autocomplete="username">
  <input class="field hidden" id="code" placeholder="الكود (6 خانات)" autocomplete="off">
  <button class="btn" id="authBtn" onclick="doAuth()">دخول</button>
  <div class="err" id="authErr"></div>
</div>

<!-- شاشة عرض الكود -->
<div id="codeView" class="hidden">
  <h2>احفظ كودك!</h2>
  <p>هذا كودك الوحيد للدخول. لن يظهر مجدداً.</p>
  <div class="code" id="codeValue"></div>
  <button class="btn" onclick="afterCode()">دخول الآن</button>
</div>

<!-- شاشة المحادثات -->
<div id="chats" class="hidden">
  <div class="header">
    <h2>المحادثات</h2>
    <button onclick="showNewGroup()" title="مجموعة">＋</button>
    <button onclick="logout()" title="خروج">⏻</button>
  </div>
  <div id="chatList"></div>
</div>

<!-- شاشة المحادثة -->
<div id="conversation" class="hidden">
  <div class="header">
    <button onclick="backToChats()">←</button>
    <h2 id="convTitle"></h2>
  </div>
  <div id="messages"></div>
  <div id="composer">
    <input id="msgInput" placeholder="رسالة..." onkeydown="if(event.key==='Enter')sendMsg()">
    <button onclick="sendMsg()">➤</button>
  </div>
</div>

<!-- شاشة مجموعة جديدة -->
<div id="newgroup" class="hidden">
  <div class="header">
    <button onclick="backToChats()">←</button>
    <h2>مجموعة جديدة</h2>
  </div>
  <div style="padding:16px">
    <input class="field" id="groupName" placeholder="اسم المجموعة">
    <input class="field" id="userSearch" placeholder="ابحث عن صديق..." oninput="searchUsers()">
    <div id="userResults"></div>
    <button class="btn" onclick="createGroup()">إنشاء</button>
  </div>
</div>

<script>
const state = {
  token: localStorage.getItem('token') || '',
  userId: Number(localStorage.getItem('userId') || 0),
  username: localStorage.getItem('username') || '',
  tab: 'login',
  currentChat: null,
  ws: null,
  selectedUsers: new Set(),
  pendingCode: null,
  pendingUser: null,
};

function $(id) { return document.getElementById(id); }
function show(id) {
  ['auth','codeView','chats','conversation','newgroup'].forEach(x =>
    $(x).classList.toggle('hidden', x !== id));
}

async function api(path, opts = {}) {
  const headers = { 'Content-Type': 'application/json', ...(opts.headers || {}) };
  if (state.token) headers['Authorization'] = 'Bearer ' + state.token;
  const res = await fetch(path, { ...opts, headers });
  if (res.status === 401) { doLogout(); throw new Error('unauthorized'); }
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    throw new Error(body.error || 'خطأ ' + res.status);
  }
  if (res.status === 204) return null;
  return res.json();
}

function setTab(t) {
  state.tab = t;
  document.querySelectorAll('.tab').forEach((b,i) =>
    b.classList.toggle('active', (i===0) === (t==='login')));
  $('code').classList.toggle('hidden', t === 'register');
  $('authBtn').textContent = t === 'login' ? 'دخول' : 'تسجيل';
  $('authErr').textContent = '';
}

async function doAuth() {
  $('authErr').textContent = '';
  $('authBtn').disabled = true;
  try {
    const username = $('username').value.trim();
    if (state.tab === 'register') {
      const r = await api('/api/register', {
        method: 'POST', body: JSON.stringify({ username })
      });
      state.pendingCode = r.code;
      state.pendingUser = r.username;
      $('codeValue').textContent = r.code;
      show('codeView');
    } else {
      const r = await api('/api/login', {
        method: 'POST',
        body: JSON.stringify({ username, code: $('code').value.trim() })
      });
      saveSession(r);
      enterApp();
    }
  } catch (e) {
    $('authErr').textContent = e.message;
  } finally {
    $('authBtn').disabled = false;
  }
}

async function afterCode() {
  try {
    const r = await api('/api/login', {
      method: 'POST',
      body: JSON.stringify({ username: state.pendingUser, code: state.pendingCode })
    });
    saveSession(r);
    enterApp();
  } catch (e) {
    alert('خطأ: ' + e.message);
  }
}

function saveSession(r) {
  state.token = r.token;
  state.userId = r.user_id;
  state.username = r.username;
  localStorage.setItem('token', r.token);
  localStorage.setItem('userId', r.user_id);
  localStorage.setItem('username', r.username);
}

function enterApp() {
  show('chats');
  connectWS();
  loadChats();
}

async function loadChats() {
  try {
    const chats = await api('/api/chats');
    const list = $('chatList');
    if (!chats.length) {
      list.innerHTML = '<div class="empty">لا محادثات بعد — اضغط ＋ لإنشاء مجموعة</div>';
      return;
    }
    list.innerHTML = '';
    chats.forEach(c => {
      const div = document.createElement('div');
      div.className = 'chat-item';
      const name = document.createElement('div');
      name.className = 'name';
      name.textContent = c.name || 'بدون اسم';
      const last = document.createElement('div');
      last.className = 'last';
      last.textContent = c.last_message || '—';
      div.appendChild(name);
      div.appendChild(last);
      div.onclick = () => openChat(c.id, c.name);
      list.appendChild(div);
    });
  } catch (e) { /* ignore */ }
}

async function openChat(id, name) {
  state.currentChat = { id, name };
  $('convTitle').textContent = name || 'دردشة';
  $('messages').innerHTML = '';
  show('conversation');
  try {
    const msgs = await api('/api/chats/' + id);
    msgs.reverse().forEach(m => appendMsg(m, false));
  } catch (e) { /* ignore */ }
}

function appendMsg(m, scroll = true) {
  const div = document.createElement('div');
  div.className = 'msg ' + (m.sender_id === state.userId ? 'me' : 'them');
  div.textContent = m.content;
  $('messages').appendChild(div);
  if (scroll) $('messages').scrollTop = $('messages').scrollHeight;
}

function sendMsg() {
  const input = $('msgInput');
  const text = input.value.trim();
  if (!text || !state.currentChat) return;
  if (state.ws && state.ws.readyState === WebSocket.OPEN) {
    state.ws.send(JSON.stringify({
      type: 'send', chat_id: state.currentChat.id, content: text
    }));
    input.value = '';
  } else {
    alert('غير متصل، أعد المحاولة');
  }
}

function connectWS() {
  if (state.ws) state.ws.close();
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const url = proto + '//' + location.host + '/ws?token=' + encodeURIComponent(state.token);
  state.ws = new WebSocket(url);
  state.ws.onmessage = (ev) => {
    try {
      const data = JSON.parse(ev.data);
      if (data.type === 'message') {
        if (state.currentChat && data.message.chat_id === state.currentChat.id) {
          appendMsg(data.message);
        }
        if (!$('chats').classList.contains('hidden')) loadChats();
      }
    } catch (e) {}
  };
  state.ws.onclose = () => setTimeout(connectWS, 3000);
}

function backToChats() {
  state.currentChat = null;
  show('chats');
  loadChats();
}

function showNewGroup() {
  state.selectedUsers.clear();
  $('groupName').value = '';
  $('userSearch').value = '';
  $('userResults').innerHTML = '';
  show('newgroup');
}

let searchTimer;
function searchUsers() {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(async () => {
    const q = $('userSearch').value.trim();
    if (!q) { $('userResults').innerHTML = ''; return; }
    try {
      const users = await api('/api/users?q=' + encodeURIComponent(q));
      const box = $('userResults');
      box.innerHTML = '';
      users.forEach(u => {
        const div = document.createElement('div');
        div.className = 'user-item' + (state.selectedUsers.has(u.username) ? ' selected' : '');
        div.textContent = u.username;
        div.onclick = () => {
          if (state.selectedUsers.has(u.username)) state.selectedUsers.delete(u.username);
          else state.selectedUsers.add(u.username);
          div.classList.toggle('selected');
        };
        box.appendChild(div);
      });
    } catch (e) {}
  }, 300);
}

async function createGroup() {
  const name = $('groupName').value.trim();
  if (!name || state.selectedUsers.size === 0) {
    alert('اسم المجموعة ومشارك واحد مطلوبان');
    return;
  }
  try {
    await api('/api/chats/group', {
      method: 'POST',
      body: JSON.stringify({ name, members: Array.from(state.selectedUsers) })
    });
    backToChats();
  } catch (e) { alert(e.message); }
}

function doLogout() {
  state.token = ''; state.userId = 0; state.username = '';
  localStorage.clear();
  if (state.ws) state.ws.close();
  show('auth');
}

async function logout() {
  try { await api('/api/logout', { method: 'POST' }); } catch (e) {}
  doLogout();
}

// بدء التطبيق
if (state.token) {
  enterApp();
} else {
  show('auth');
}
</script>
</body>
</html>
